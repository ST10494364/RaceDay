name: CI - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -f README.md
          test -d docs
          test -f RaceDay.Api/RaceDay.Api.csproj
          test -f RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build
        run: dotnet build RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-build --configuration Release --verbosity normal